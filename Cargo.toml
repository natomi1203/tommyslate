[package]
name = "tommyslate"
version = "0.5.0"
edition = "2024"
rust-version = "1.85"
description = "TommySlate certified anytime slate construction with Python bindings"
license = "Apache-2.0"
repository = "https://github.com/natomi1203/tommyslate"

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.30.1", features = ["abi3-py310"] }
prost = "0.13.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal"] }
tokio-stream = { version = "0.1.19", features = ["net"] }
tonic = { version = "0.12.3", features = ["transport"] }

[build-dependencies]
protoc-bin-vendored = "3.2.0"
tonic-build = "0.12.3"

[[bin]]
name = "safe-slate-sidecar"
path = "src/bin/safe_slate_sidecar.rs"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(coverage)"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
