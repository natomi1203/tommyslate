name: Qualify and publish TommySlate

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact 40-character source commit SHA to build
        required: true
        type: string
      qualified_run_id:
        description: Prior successful TestPyPI run to promote without rebuilding
        required: false
        default: ""
        type: string
      publish_testpypi:
        description: Publish the verified artifacts to TestPyPI
        required: true
        default: false
        type: boolean
      publish_pypi:
        description: Publish the same TestPyPI-verified artifacts to production PyPI
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.15"
  RUST_VERSION: "1.99.0"
  MATURIN_VERSION: "v1.16.0"
  PACKAGE_NAME: "tommyslate"
  PACKAGE_VERSION: "0.5.0"

jobs:
  validate-source:
    runs-on: ubuntu-24.04
    steps:
      - name: Validate source SHA format
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          QUALIFIED_RUN_ID: ${{ inputs.qualified_run_id }}
          PUBLISH_TESTPYPI: ${{ inputs.publish_testpypi }}
          PUBLISH_PYPI: ${{ inputs.publish_pypi }}
        run: |
          if [[ ! "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "source_sha must be a lowercase 40-character commit SHA" >&2
            exit 1
          fi
          if [[ -n "$QUALIFIED_RUN_ID" && ! "$QUALIFIED_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "qualified_run_id must be empty or a numeric GitHub Actions run ID" >&2
            exit 1
          fi
          if [[ -n "$QUALIFIED_RUN_ID" && "$PUBLISH_TESTPYPI" == "true" ]]; then
            echo "a promotion run must reuse TestPyPI artifacts without publishing new ones" >&2
            exit 1
          fi
          if [[ -n "$QUALIFIED_RUN_ID" && "$PUBLISH_PYPI" != "true" ]]; then
            echo "qualified_run_id is accepted only for production promotion" >&2
            exit 1
          fi
          if [[ "$PUBLISH_PYPI" == "true" && "$PUBLISH_TESTPYPI" != "true" && -z "$QUALIFIED_RUN_ID" ]]; then
            echo "production requires TestPyPI qualification in this run or qualified_run_id" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Confirm source and package contract
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 - <<'PY'
          import tomllib
          import os
          from pathlib import Path

          pyproject = tomllib.loads(Path("pyproject.toml").read_text())
          cargo = tomllib.loads(Path("Cargo.toml").read_text())
          expected = os.environ["PACKAGE_VERSION"]
          assert pyproject["project"]["version"] == expected
          assert cargo["package"]["version"] == expected
          assert pyproject["project"]["name"] == os.environ["PACKAGE_NAME"]
          assert cargo["package"]["name"] == os.environ["PACKAGE_NAME"]
          assert pyproject["tool"]["maturin"]["module-name"] == "safe_slate._core"
          assert pyproject["project"]["license"] == "Apache-2.0"
          assert cargo["package"]["license"] == "Apache-2.0"
          PY

  build-wheels:
    name: Build and smoke ${{ matrix.platform.name }}
    if: inputs.qualified_run_id == ''
    needs: validate-source
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            manylinux: "2_28"
            deployment-target: ""
          - name: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            manylinux: "2_28"
            deployment-target: ""
          - name: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            manylinux: ""
            deployment-target: "11.0"
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            manylinux: ""
            deployment-target: "11.0"
          - name: windows-x86_64
            os: windows-2025
            target: x86_64-pc-windows-msvc
            manylinux: ""
            deployment-target: ""
    runs-on: ${{ matrix.platform.os }}
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.platform.deployment-target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - id: python311
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - id: python315
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build wheel
        if: matrix.platform.name != 'linux-aarch64'
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: build
          maturin-version: ${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_VERSION }}
          target: ${{ matrix.platform.target }}
          manylinux: ${{ matrix.platform.manylinux }}
          args: >-
            --release --locked --compatibility pypi
            -i python3.15 --out dist
      - name: Build wheel (Linux ARM64)
        if: matrix.platform.name == 'linux-aarch64'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MATURIN_ASSET_ID: "688760471"
          MATURIN_ASSET_SHA256: 7b7321340805f90d65f138ba8831c789b706086153f1cfb97d915c5ac6ad6c4d
          MANYLINUX_IMAGE: quay.io/pypa/manylinux_2_28_aarch64@sha256:cb37f0d66c8a75abb93cf6085cad1f1427cd7208f0c0fc48359bb1eea9924f21
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/tommyslate-maturin"
          mkdir -p "$tool_dir"
          gh api \
            -H 'Accept: application/octet-stream' \
            "repos/PyO3/maturin/releases/assets/$MATURIN_ASSET_ID" \
            > "$tool_dir/maturin.tar.gz"
          printf '%s  %s\n' \
            "$MATURIN_ASSET_SHA256" \
            "$tool_dir/maturin.tar.gz" \
            | sha256sum --check --strict
          tar -xzf "$tool_dir/maturin.tar.gz" -C "$tool_dir" maturin
          chmod 0555 "$tool_dir/maturin"

          docker pull "$MANYLINUX_IMAGE"
          docker run --rm \
            --workdir /io \
            --volume "$GITHUB_WORKSPACE:/io" \
            --volume "$tool_dir/maturin:/usr/local/bin/maturin:ro" \
            --env RUST_VERSION \
            "$MANYLINUX_IMAGE" \
            /bin/bash -euxo pipefail -c '
              curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs \
                | sh -s -- -y --profile minimal --default-toolchain none
              export PATH="/root/.cargo/bin:$PATH"
              rustup toolchain install "$RUST_VERSION" --profile minimal
              rustup default "$RUST_VERSION"
              maturin build \
                --release --locked --compatibility pypi \
                -i /opt/python/cp315-cp315/bin/python3.15 \
                --out dist
            '
      - name: Install and smoke-test local wheel
        shell: bash
        env:
          PYTHON_311: ${{ steps.python311.outputs.python-path }}
          PYTHON_315: ${{ steps.python315.outputs.python-path }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import venv

          wheels = list(Path("dist").resolve().glob("*.whl"))
          assert len(wheels) == 1, wheels
          smoke = """
          from safe_slate import optimize_slate
          kwargs = dict(
              rewards=[2.0, 1.0],
              safety_means=[1.0, 1.0],
              safety_variances=[0.0, 0.0],
              max_items=1,
          )
          first = optimize_slate(**kwargs)
          second = optimize_slate(**kwargs)
          assert first.selected_indices == second.selected_indices == [0]
          assert first.rechecked and second.rechecked
          from safe_slate import guarded_rerank
          request = dict(
              request_id="release-smoke",
              baseline_item_ids=[10, 11],
              protected_count=1,
              remove_positions=[1],
              add_item_ids=[100],
              reward_deltas=[0.5],
              safety_mean_deltas=[0.1],
              safety_variances=[0.0],
              baseline_metric=0.5,
              degradation_tolerance=0.01,
              max_replacements=1,
          )
          approved = guarded_rerank(
              **request,
              support_ok=True,
              uncertainty_valid=True,
              distribution_shift_detected=False,
              proposal_log_complete=True,
          )
          kept = guarded_rerank(**request)
          assert approved.slate == (10, 100) and approved.oracle.rechecked
          assert kept.slate == (10, 11) and kept.fallback and kept.oracle.rechecked
          """
          for version, base_python in (
              ("3.11", os.environ["PYTHON_311"]),
              ("3.15", os.environ["PYTHON_315"]),
          ):
              environment = Path(
                  tempfile.mkdtemp(prefix=f"tommyslate-wheel-{version}-")
              )
              subprocess.run([base_python, "-m", "venv", environment], check=True)
              python = environment / (
                  "Scripts/python.exe" if os.name == "nt" else "bin/python"
              )
              subprocess.run(
                  [python, "-m", "pip", "install", "--no-index", str(wheels[0])],
                  check=True,
              )
              subprocess.run([python, "-m", "pip", "check"], check=True)
              subprocess.run([python, "-c", smoke], cwd=environment, check=True)
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheel-${{ matrix.platform.name }}
          path: dist/*.whl
          if-no-files-found: error
          retention-days: 14

  build-sdist:
    if: inputs.qualified_run_id == ''
    runs-on: ubuntu-24.04
    needs: validate-source
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          maturin-version: ${{ env.MATURIN_VERSION }}
          rust-toolchain: ${{ env.RUST_VERSION }}
          args: --out dist
      - name: Confirm locked Rust graph
        run: cargo +${{ env.RUST_VERSION }} metadata --locked --format-version 1 > /dev/null
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14

  aggregate:
    name: Verify complete release set
    if: inputs.qualified_run_id == ''
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheel-*
          path: incoming
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sdist
          path: incoming
      - name: Check metadata and generate immutable inventory
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python -m pip install --disable-pip-version-check twine==6.2.0
          python -m twine check incoming/*
          mkdir -p release/packages
          cp incoming/*.whl incoming/*.tar.gz release/packages/
          python scripts/verify_release_artifacts.py \
            incoming \
            --source-sha "$SOURCE_SHA" \
            --version "$PACKAGE_VERSION" \
            --output-dir release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualified-release-${{ inputs.source_sha }}
          path: release
          if-no-files-found: error
          retention-days: 14

  testpypi-preflight:
    name: Check TestPyPI retry safety
    if: inputs.publish_testpypi == true && inputs.qualified_run_id == ''
    needs: aggregate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualified-release-${{ inputs.source_sha }}
          path: release
      - name: Reject conflicting existing files
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import urlopen

          manifest = json.loads(Path("release/release-manifest.json").read_text())
          expected = {item["filename"]: item["sha256"] for item in manifest["files"]}
          version = os.environ["PACKAGE_VERSION"]
          project = os.environ["PACKAGE_NAME"]
          url = f"https://test.pypi.org/pypi/{project}/{version}/json"
          try:
              with urlopen(url, timeout=30) as response:
                  payload = json.load(response)
          except HTTPError as error:
              if error.code != 404:
                  raise
              payload = {"urls": []}
          for item in payload["urls"]:
              filename = item["filename"]
              remote_hash = item["digests"]["sha256"]
              if filename not in expected or expected[filename] != remote_hash:
                  raise SystemExit(f"conflicting TestPyPI file: {filename}")
          print(f"preflight accepted {len(payload['urls'])} existing file(s)")
          PY

  publish-testpypi:
    name: Publish to TestPyPI with OIDC
    if: inputs.publish_testpypi == true && inputs.qualified_run_id == ''
    needs: testpypi-preflight
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/tommyslate/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualified-release-${{ inputs.source_sha }}
          path: release
      - name: Publish immutable packages
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: release/packages
          skip-existing: true
          verify-metadata: true
          print-hash: true
          attestations: true

  verify-testpypi:
    name: Match TestPyPI hashes
    if: inputs.publish_testpypi == true && inputs.qualified_run_id == ''
    needs: publish-testpypi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualified-release-${{ inputs.source_sha }}
          path: release
      - name: Compare remote files with manifest
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import time
          from urllib.error import HTTPError
          from urllib.request import urlopen

          manifest = json.loads(Path("release/release-manifest.json").read_text())
          expected = {item["filename"]: item["sha256"] for item in manifest["files"]}
          version = os.environ["PACKAGE_VERSION"]
          project = os.environ["PACKAGE_NAME"]
          url = f"https://test.pypi.org/pypi/{project}/{version}/json"
          remote = None
          for attempt in range(12):
              try:
                  with urlopen(url, timeout=30) as response:
                      payload = json.load(response)
                  remote = {
                      item["filename"]: item["digests"]["sha256"]
                      for item in payload["urls"]
                  }
              except HTTPError as error:
                  if error.code != 404:
                      raise
              if remote == expected:
                  break
              if attempt < 11:
                  time.sleep(10)
          if remote != expected:
              raise SystemExit(
                  f"TestPyPI files differ from manifest: expected={expected}, remote={remote}"
              )
          print("TestPyPI filenames and SHA-256 values match the release manifest")
          PY

  smoke-test-testpypi:
    name: Install from TestPyPI on ${{ matrix.platform.name }}
    if: inputs.publish_testpypi == true && inputs.qualified_run_id == ''
    needs: verify-testpypi
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-x86_64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-15
          - name: windows-x86_64
            os: windows-2025
    runs-on: ${{ matrix.platform.os }}
    steps:
      - id: python311
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - id: python315
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install exact TestPyPI version and smoke-test
        shell: bash
        env:
          PYTHON_311: ${{ steps.python311.outputs.python-path }}
          PYTHON_315: ${{ steps.python315.outputs.python-path }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import venv

          smoke = """
          from safe_slate import optimize_slate
          kwargs = dict(
              rewards=[2.0, 1.0],
              safety_means=[1.0, 1.0],
              safety_variances=[0.0, 0.0],
              max_items=1,
          )
          first = optimize_slate(**kwargs)
          second = optimize_slate(**kwargs)
          assert first.selected_indices == second.selected_indices == [0]
          assert first.rechecked and second.rechecked
          from safe_slate import guarded_rerank
          request = dict(
              request_id="release-smoke",
              baseline_item_ids=[10, 11],
              protected_count=1,
              remove_positions=[1],
              add_item_ids=[100],
              reward_deltas=[0.5],
              safety_mean_deltas=[0.1],
              safety_variances=[0.0],
              baseline_metric=0.5,
              degradation_tolerance=0.01,
              max_replacements=1,
          )
          approved = guarded_rerank(
              **request,
              support_ok=True,
              uncertainty_valid=True,
              distribution_shift_detected=False,
              proposal_log_complete=True,
          )
          kept = guarded_rerank(**request)
          assert approved.slate == (10, 100) and approved.oracle.rechecked
          assert kept.slate == (10, 11) and kept.fallback and kept.oracle.rechecked
          """
          for version, base_python in (
              ("3.11", os.environ["PYTHON_311"]),
              ("3.15", os.environ["PYTHON_315"]),
          ):
              environment = Path(
                  tempfile.mkdtemp(prefix=f"tommyslate-testpypi-{version}-")
              )
              subprocess.run([base_python, "-m", "venv", environment], check=True)
              python = environment / (
                  "Scripts/python.exe" if os.name == "nt" else "bin/python"
              )
              subprocess.run(
                  [
                      python,
                      "-m",
                      "pip",
                      "install",
                      "--index-url",
                      "https://test.pypi.org/simple/",
                      "--no-deps",
                      f"{os.environ['PACKAGE_NAME']}=={os.environ['PACKAGE_VERSION']}",
                  ],
                  check=True,
              )
              subprocess.run([python, "-m", "pip", "check"], check=True)
              subprocess.run([python, "-c", smoke], cwd=environment, check=True)
          PY

  recover-qualified-release:
    name: Recover exact TestPyPI-qualified artifacts
    if: inputs.qualified_run_id != '' && inputs.publish_pypi == true
    needs: validate-source
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Verify source workflow run identity
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFIED_RUN_ID: ${{ inputs.qualified_run_id }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$QUALIFIED_RUN_ID")"
          test "$(jq -r .status <<<"$run_json")" = "completed"
          test "$(jq -r .conclusion <<<"$run_json")" = "success"
          test "$(jq -r .event <<<"$run_json")" = "workflow_dispatch"
          test "$(jq -r .head_branch <<<"$run_json")" = "main"
          test "$(jq -r .head_sha <<<"$run_json")" = "$SOURCE_SHA"
          test "$(jq -r .path <<<"$run_json")" = ".github/workflows/safe-slate-release.yml"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualified-release-${{ inputs.source_sha }}
          path: release
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualified_run_id }}
      - name: Match recovered files and TestPyPI to the frozen manifest
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.request import urlopen

          root = Path("release")
          manifest = json.loads((root / "release-manifest.json").read_text())
          if manifest.get("schema_version") != "1.0.0":
              raise SystemExit("unsupported release manifest schema")
          if manifest.get("project") != os.environ["PACKAGE_NAME"]:
              raise SystemExit("release manifest project mismatch")
          if manifest.get("version") != os.environ["PACKAGE_VERSION"]:
              raise SystemExit("release manifest version mismatch")
          if manifest.get("source_sha") != os.environ["SOURCE_SHA"]:
              raise SystemExit("release manifest source SHA mismatch")

          files = manifest.get("files")
          if not isinstance(files, list) or len(files) != 6:
              raise SystemExit("release manifest must contain exactly six files")
          expected = {}
          for item in files:
              filename = item["filename"]
              path = root / "packages" / filename
              if not path.is_file():
                  raise SystemExit(f"missing recovered artifact: {filename}")
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              if digest != item["sha256"] or path.stat().st_size != item["size"]:
                  raise SystemExit(f"recovered artifact differs: {filename}")
              expected[filename] = digest
          actual = {
              path.name
              for path in (root / "packages").iterdir()
              if path.suffix == ".whl" or path.name.endswith(".tar.gz")
          }
          if actual != set(expected):
              raise SystemExit("recovered artifact filenames differ from manifest")

          project = os.environ["PACKAGE_NAME"]
          version = os.environ["PACKAGE_VERSION"]
          with urlopen(
              f"https://test.pypi.org/pypi/{project}/{version}/json", timeout=30
          ) as response:
              payload = json.load(response)
          remote = {
              item["filename"]: item["digests"]["sha256"]
              for item in payload["urls"]
          }
          if remote != expected:
              raise SystemExit(
                  f"TestPyPI differs from recovered manifest: expected={expected}, "
                  f"remote={remote}"
              )
          print("recovered files and TestPyPI match the frozen manifest")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qualified-release-${{ inputs.source_sha }}
          path: release
          if-no-files-found: error
          retention-days: 14

  pypi-preflight:
    name: Check production PyPI retry safety
    if: >-
      always() && inputs.publish_pypi == true &&
      ((inputs.qualified_run_id == '' && needs.smoke-test-testpypi.result == 'success') ||
       (inputs.qualified_run_id != '' && needs.recover-qualified-release.result == 'success'))
    needs: [smoke-test-testpypi, recover-qualified-release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualified-release-${{ inputs.source_sha }}
          path: release
      - name: Reject conflicting existing production files
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import urlopen

          manifest = json.loads(Path("release/release-manifest.json").read_text())
          expected = {item["filename"]: item["sha256"] for item in manifest["files"]}
          version = os.environ["PACKAGE_VERSION"]
          project = os.environ["PACKAGE_NAME"]
          url = f"https://pypi.org/pypi/{project}/{version}/json"
          try:
              with urlopen(url, timeout=30) as response:
                  payload = json.load(response)
          except HTTPError as error:
              if error.code != 404:
                  raise
              payload = {"urls": []}
          for item in payload["urls"]:
              filename = item["filename"]
              remote_hash = item["digests"]["sha256"]
              if filename not in expected or expected[filename] != remote_hash:
                  raise SystemExit(f"conflicting production PyPI file: {filename}")
          print(f"production preflight accepted {len(payload['urls'])} existing file(s)")
          PY

  publish-pypi:
    name: Publish to production PyPI with OIDC
    if: >-
      always() && inputs.publish_pypi == true &&
      needs.pypi-preflight.result == 'success'
    needs: pypi-preflight
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/tommyslate/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualified-release-${{ inputs.source_sha }}
          path: release
      - name: Publish immutable production packages
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: release/packages
          skip-existing: true
          verify-metadata: true
          print-hash: true
          attestations: true

  verify-pypi:
    name: Match production PyPI hashes
    if: >-
      always() && inputs.publish_pypi == true &&
      needs.publish-pypi.result == 'success'
    needs: publish-pypi
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: qualified-release-${{ inputs.source_sha }}
          path: release
      - name: Compare production files with manifest
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import time
          from urllib.error import HTTPError
          from urllib.request import urlopen

          manifest = json.loads(Path("release/release-manifest.json").read_text())
          expected = {item["filename"]: item["sha256"] for item in manifest["files"]}
          version = os.environ["PACKAGE_VERSION"]
          project = os.environ["PACKAGE_NAME"]
          url = f"https://pypi.org/pypi/{project}/{version}/json"
          remote = None
          for attempt in range(12):
              try:
                  with urlopen(url, timeout=30) as response:
                      payload = json.load(response)
                  remote = {
                      item["filename"]: item["digests"]["sha256"]
                      for item in payload["urls"]
                  }
              except HTTPError as error:
                  if error.code != 404:
                      raise
              if remote == expected:
                  break
              if attempt < 11:
                  time.sleep(10)
          if remote != expected:
              raise SystemExit(
                  f"production PyPI files differ from manifest: expected={expected}, remote={remote}"
              )
          print("production PyPI filenames and SHA-256 values match the release manifest")
          PY

  smoke-test-pypi:
    name: Install from production PyPI on ${{ matrix.platform.name }}
    if: >-
      always() && inputs.publish_pypi == true &&
      needs.verify-pypi.result == 'success'
    needs: verify-pypi
    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: linux-x86_64
            os: ubuntu-24.04
          - name: linux-aarch64
            os: ubuntu-24.04-arm
          - name: macos-x86_64
            os: macos-15-intel
          - name: macos-arm64
            os: macos-15
          - name: windows-x86_64
            os: windows-2025
    runs-on: ${{ matrix.platform.os }}
    steps:
      - id: python311
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - id: python315
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install exact production version and smoke-test
        shell: bash
        env:
          PYTHON_311: ${{ steps.python311.outputs.python-path }}
          PYTHON_315: ${{ steps.python315.outputs.python-path }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import tempfile
          import venv

          smoke = """
          from safe_slate import optimize_slate
          kwargs = dict(
              rewards=[2.0, 1.0],
              safety_means=[1.0, 1.0],
              safety_variances=[0.0, 0.0],
              max_items=1,
          )
          first = optimize_slate(**kwargs)
          second = optimize_slate(**kwargs)
          assert first.selected_indices == second.selected_indices == [0]
          assert first.rechecked and second.rechecked
          from safe_slate import guarded_rerank
          request = dict(
              request_id="release-smoke",
              baseline_item_ids=[10, 11],
              protected_count=1,
              remove_positions=[1],
              add_item_ids=[100],
              reward_deltas=[0.5],
              safety_mean_deltas=[0.1],
              safety_variances=[0.0],
              baseline_metric=0.5,
              degradation_tolerance=0.01,
              max_replacements=1,
          )
          approved = guarded_rerank(
              **request,
              support_ok=True,
              uncertainty_valid=True,
              distribution_shift_detected=False,
              proposal_log_complete=True,
          )
          kept = guarded_rerank(**request)
          assert approved.slate == (10, 100) and approved.oracle.rechecked
          assert kept.slate == (10, 11) and kept.fallback and kept.oracle.rechecked
          """
          for version, base_python in (
              ("3.11", os.environ["PYTHON_311"]),
              ("3.15", os.environ["PYTHON_315"]),
          ):
              environment = Path(
                  tempfile.mkdtemp(prefix=f"tommyslate-pypi-{version}-")
              )
              subprocess.run([base_python, "-m", "venv", environment], check=True)
              python = environment / (
                  "Scripts/python.exe" if os.name == "nt" else "bin/python"
              )
              subprocess.run(
                  [
                      python,
                      "-m",
                      "pip",
                      "install",
                      "--index-url",
                      "https://pypi.org/simple/",
                      "--retries",
                      "10",
                      "--no-deps",
                      f"{os.environ['PACKAGE_NAME']}=={os.environ['PACKAGE_VERSION']}",
                  ],
                  check=True,
              )
              subprocess.run([python, "-m", "pip", "check"], check=True)
              subprocess.run([python, "-c", smoke], cwd=environment, check=True)
          PY
