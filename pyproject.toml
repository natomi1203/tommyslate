[build-system]
requires = ["maturin>=1.16,<2"]
build-backend = "maturin"

[project]
name = "tommyslate"
version = "0.5.0"
description = "Safely improve ranked lists—or keep the original—with constraints, uncertainty checks, and an audit trail."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["recommender-systems", "safe-optimization", "slate-ranking", "rust"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
test = ["mypy>=2.4,<3", "pytest>=8.4,<10"]

[project.scripts]
tommyslate-freeze-inputs = "safe_slate.external_intake:main"
safe-slate-freeze-inputs = "safe_slate.external_intake:main"

[project.urls]
Repository = "https://github.com/natomi1203/tommyslate"
Documentation = "https://github.com/natomi1203/tommyslate/tree/main/docs"
Changelog = "https://github.com/natomi1203/tommyslate/blob/main/CHANGELOG.md"
Issues = "https://github.com/natomi1203/tommyslate/issues"

[dependency-groups]
dev = [
  "coverage==7.17.2",
  "maturin>=1.16,<2",
  "mypy>=2.4,<3",
  "pytest>=8.4,<10",
]

[tool.maturin]
python-source = "python"
module-name = "safe_slate._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
branch = true
source = ["safe_slate"]

[tool.coverage.report]
show_missing = true
